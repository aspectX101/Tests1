<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UND.CC Tweaker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="v2.css">
  <link rel="stylesheet" href="debloat.css">
  <link rel="stylesheet" href="optimization.css">
  <link rel="stylesheet" href="ignition.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="booting">
  <div class="splash ignition" id="splash" aria-hidden="true">
    <div class="ignition-grid"></div>
    <div class="ignition-halo"></div>
    <div class="ignition-orbit orbit-a"></div>
    <div class="ignition-orbit orbit-b"></div>
    <div class="ignition-emblem">
      <svg viewBox="0 0 120 120" fill="none">
        <path class="ignition-shard shard-left" d="M24 23H47V73C47 83 51 88 60 88V110C36 110 24 97 24 73Z"/>
        <path class="ignition-shard shard-right" d="M96 23H73V73C73 83 69 88 60 88V110C84 110 96 97 96 73Z"/>
        <path class="ignition-edge" d="M24 23V73C24 97 36 110 60 110C84 110 96 97 96 73V23"/>
      </svg>
    </div>
    <div class="ignition-wave"></div>
    <div class="ignition-flare"></div>
    <div class="ignition-wordmark"><span>UND</span><b>.CC</b><small>TWEAKER</small></div>
    <div class="ignition-horizon"></div>
    <div class="ignition-signature">UND.CC</div>
  </div>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="logo" src="assets/logo-icon.png" alt="" width="44" height="44">
        <div class="brand-text">
          <div class="brand-name">UND<span>.CC</span></div>
          <div class="brand-sub">Tweaker <span class="brand-ver"></span></div>
        </div>
      </div>
      <label class="nav-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="nav-search" type="search" autocomplete="off" spellcheck="false"><kbd>Ctrl F</kbd></label>
      <nav class="nav" id="nav"></nav>
    </aside>

    <main class="main">
      <header class="titlebar">
        <div class="crumbs" id="crumbs"></div>
        <div class="win-controls">
          <button class="win-btn" id="win-min" aria-label="Minimieren">
            <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
          </button>
          <button class="win-btn close" id="win-close" aria-label="Schließen">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>
      <section class="content" id="content"></section>
      <footer class="statusbar" id="statusbar"></footer>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <p id="modal-text" class="muted"></p>
      <div id="modal-extra" class="modal-extra"></div>
      <div class="modal-actions">
        <button class="pill dark" id="modal-cancel"></button>
        <button class="pill light" id="modal-ok"></button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="../tweak-catalog.js"></script>
  <script src="../debloat-catalog.js"></script>
  <script src="../debloat-mock.js"></script>
  <script src="../mock.js"></script>
  <script src="i18n.js"></script>
  <script src="debloat-i18n.js"></script>
  <script src="debloat.js"></script>
  <script src="optimization.js"></script>
  <script src="dashboard-media.js"></script>
  <script src="app.js"></script>
</body>
</html>
