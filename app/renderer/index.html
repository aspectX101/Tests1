<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UND.CC Tweaker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="debloat.css">
</head>
<body class="booting">
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-smoke a"></div><div class="splash-smoke b"></div>
    <div class="splash-core">
      <div class="splash-ring"></div>
      <img class="splash-logo" src="assets/logo-icon.png" alt="">
    </div>
    <div class="splash-lines"><i></i><i></i></div>
    <div class="splash-title"><span>UND</span><b>.CC</b></div>
    <div class="splash-sub">TWEAKER</div>
    <div class="splash-bar"><i></i></div>
  </div>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="logo" src="assets/logo-icon.png" alt="" width="44" height="44">
        <div class="brand-text">
          <div class="brand-name">UND<span>.CC</span></div>
          <div class="brand-sub">Tweaker <span class="brand-ver"></span></div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>

    <main class="main">
      <header class="titlebar">
        <div class="crumbs" id="crumbs"></div>
        <div class="win-controls">
          <button class="win-btn" id="win-min" aria-label="Minimieren">
            <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
          </button>
          <button class="win-btn close" id="win-close" aria-label="Schließen">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <p id="modal-text" class="muted"></p>
      <div id="modal-extra" class="modal-extra"></div>
      <div class="modal-actions">
        <button class="pill dark" id="modal-cancel"></button>
        <button class="pill light" id="modal-ok"></button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="../tweak-catalog.js"></script>
  <script src="../debloat-catalog.js"></script>
  <script src="../debloat-mock.js"></script>
  <script src="../mock.js"></script>
  <script src="i18n.js"></script>
  <script src="debloat-i18n.js"></script>
  <script src="debloat.js"></script>
  <script src="app.js"></script>
</body>
</html>
