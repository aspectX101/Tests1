<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H1T.CC | Tweak Utility</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="v2.css">
  <link rel="stylesheet" href="debloat.css">
  <link rel="stylesheet" href="optimization.css">
  <link rel="stylesheet" href="ignition.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="mods.css">
  <link rel="stylesheet" href="color.css">
  <link rel="stylesheet" href="recommend.css">
  <link rel="stylesheet" href="h1t.css">
  <link rel="stylesheet" href="h1t-dashboard.css">
  <link rel="stylesheet" href="motion.css">
</head>
<body class="booting">
  <div class="splash ignition" id="splash" aria-hidden="true">
    <div class="ignition-grid"></div>
    <div class="ignition-halo"></div>
    <div class="ignition-orbit orbit-a"></div>
    <div class="ignition-orbit orbit-b"></div>
    <div class="ignition-emblem">
      <img src="assets/h1t-emblem.svg" alt="" class="h1t-splash-emblem">
    </div>
    <div class="ignition-wave"></div>
    <div class="ignition-flare"></div>
    <div class="ignition-wordmark"><span>H1T</span><b>.CC</b><small>TWEAK UTILITY</small></div>
    <div class="ignition-horizon"></div>
    <div class="ignition-signature">H1T.CC · PRECISION ENGINEERED</div>
  </div>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="14"/><path d="M6 20h28M20 6c-10 8-10 20 0 28M20 6c10 8 10 20 0 28M10 12h20M10 28h20"/><path d="M16 15l8 10m0-10-8 10" stroke-width="2.5"/></svg></div>
        <div class="brand-text">
          <div class="brand-name">H1T<span>.CC</span></div>
          <div class="brand-sub">TWEAK UTILITY <span class="brand-ver"></span></div>
        </div>
      </div>
      <label class="nav-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="nav-search" type="search" autocomplete="off" spellcheck="false"><kbd>Ctrl K</kbd></label>
      <nav class="nav" id="nav"></nav>
    </aside>

    <main class="main">
      <header class="titlebar">
        <div class="crumbs" id="crumbs"></div>
        <div class="h1t-topbar-meta">
          <label class="h1t-lang"><b class="h1t-lang-code" id="h1t-lang-code" aria-hidden="true">DE</b>
            <select id="h1t-language" aria-label="Language"><option value="de">Deutsch</option><option value="en">English</option><option value="it">Italiano</option></select>
          </label>
          <button id="h1t-ambient" class="h1t-ambient" type="button" aria-pressed="true" aria-label="Ambient effects"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M5 19l1.5-1.5"/></svg></button>
        </div>
        <div class="win-controls">
          <button class="win-btn" id="win-min" aria-label="Minimieren">
            <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
          </button>
          <button class="win-btn" id="win-max" aria-label="Maximieren"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button>
          <button class="win-btn close" id="win-close" aria-label="Schließen">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>
      <section class="content" id="content"></section>
      <footer class="statusbar" id="statusbar"></footer>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <p id="modal-text" class="muted"></p>
      <div id="modal-extra" class="modal-extra"></div>
      <div class="modal-actions">
        <button class="pill dark" id="modal-cancel"></button>
        <button class="pill light" id="modal-ok"></button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="../tweak-catalog.js"></script>
  <script src="../debloat-catalog.js"></script>
  <script src="../debloat-mock.js"></script>
  <script src="../mock.js"></script>
  <script src="i18n.js"></script>
  <script src="recommend.js"></script>
  <script src="debloat-i18n.js"></script>
  <script src="debloat.js"></script>
  <script src="optimization.js"></script>
  <script src="dashboard-media.js"></script>
  <script src="color.js"></script>
  <script src="app.js"></script>
</body>
</html>
