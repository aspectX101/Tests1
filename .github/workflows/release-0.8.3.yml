name: Publish approved 0.8.3 update
on:
  push:
    branches: ['codex/performance-backend']
    paths: ['release-notes/v0.8.3.md']
permissions:
  contents: write
concurrency:
  group: undcc-release-0.8.3
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify approved version
        shell: pwsh
        run: |
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne '0.8.3') { throw 'Unexpected version' }
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Publish updater asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = 'dist/UNDCC-Tweaker-0.8.3.exe'
          if (-not (Test-Path $exe)) { throw 'Portable executable missing' }
          gh release create v0.8.3 $exe --target $env:GITHUB_SHA --title 'UND.CC Tweaker 0.8.3' --notes-file release-notes/v0.8.3.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
