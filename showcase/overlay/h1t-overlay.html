  :root {
    --black: #050505;
    --graphite: #141414;
    --silver: #c9c9c9;
    --silver-dim: #8a8a8a;
    --scale: 1;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  .anchor { position: absolute; transform: scale(var(--scale)); }
  .pos-bl { left: 56px; bottom: 64px; transform-origin: left bottom; }
  .pos-br { right: 56px; bottom: 64px; transform-origin: right bottom; }
  .pos-tl { left: 56px; top: 56px; transform-origin: left top; }
  .pos-tr { right: 56px; top: 56px; transform-origin: right top; }

  .banner { position: relative; width: 700px; height: 156px; font-family: 'Inter Tight', system-ui, sans-serif; color: #fff;
    -webkit-font-smoothing: antialiased; visibility: hidden; }
  .banner.on { visibility: visible; }
  .card {
    position: absolute; inset: 0; border-radius: 16px; overflow: hidden;
    background: linear-gradient(135deg, rgba(20, 20, 20, 0.94), rgba(5, 5, 5, 0.94) 60%);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  .edge { position: absolute; left: 0; right: 0; top: 0; height: 2px; transform-origin: left center;
    background: linear-gradient(90deg, transparent, #fff 30%, #fff 70%, transparent); box-shadow: 0 0 18px 2px rgba(255, 255, 255, 0.35); }
  .logo { position: absolute; left: 26px; top: 50%; width: 150px; height: 72px; margin-top: -36px; }
  .logo img { width: 100%; height: 100%; display: block; }

  .fx { position: absolute; inset: 0; pointer-events: none; }
  .ring { position: absolute; inset: -1px; border-radius: 17px; padding: 1.5px; opacity: 0;
    background: conic-gradient(from var(--angle), transparent 0deg 240deg, rgba(255, 255, 255, 0.12) 280deg, rgba(255, 255, 255, 0.95) 325deg,
      rgba(255, 255, 255, 0.12) 345deg, transparent 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.55)); }
  .scan { position: absolute; top: -1px; left: 0; width: 180px; height: 3px; border-radius: 3px; opacity: 0;
    background: linear-gradient(90deg, transparent, #fff 50%, transparent); box-shadow: 0 0 16px 3px rgba(255, 255, 255, 0.45); }
  .edge-flash { position: absolute; left: 0; right: 0; top: 0; height: 2px; transform-origin: left center; opacity: 0;
    background: linear-gradient(90deg, transparent, #fff 25%, #fff 75%, transparent); box-shadow: 0 0 24px 4px rgba(255, 255, 255, 0.6); }
  .card-flash { position: absolute; inset: 0; opacity: 0; background: radial-gradient(120% 140% at 15% 0%, rgba(255, 255, 255, 0.16), transparent 60%); }
  .logo .flash { position: absolute; inset: 0; opacity: 0; filter: brightness(2.6) contrast(1.2); mix-blend-mode: screen; }
  .logo .slice { position: absolute; inset: 0; opacity: 0; }
  .dust { position: absolute; inset: 0; overflow: hidden; }
  .dust i { position: absolute; left: 0; top: 0; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: 0;
    box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.7); }
  .discord svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>

const EVERY = Math.max(0, num('every', 0));
const DELAY = Math.max(0, num('delay', 2));
document.documentElement.lang = lang;
document.documentElement.style.setProperty('--scale', num('scale', 1));

const $ = (id) => document.getElementById(id);
const anchor = $('anchor'), banner = $('banner');
anchor.className = `anchor pos-${pos}`;
$('label').textContent = COPY[lang].label;
const messages = COPY[lang].messages.map((text) => {
  const node = document.createElement('div');
  node.className = 'message';
  node.textContent = text;
  $('messages').appendChild(node);
  return node;
});

// Extra layers for the permanent effects: a bright copy and three glitch slices of the logo, dust motes in the card.
const logoImg = $('logo').querySelector('img');
const logoFlash = logoImg.cloneNode(); logoFlash.className = 'flash'; logoImg.after(logoFlash);
const slices = [[0, 62], [34, 30], [64, 4]].map(([top, bottom]) => {
  const node = logoImg.cloneNode(); node.className = 'slice'; node.style.clipPath = `inset(${top}% 0 ${bottom}% 0)`;
  logoFlash.after(node); return node;
});
let seed = 7;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const motes = Array.from({ length: 14 }, () => {
  const node = document.createElement('i');
  $('dust').appendChild(node);
  return { node, x: 190 + rand() * 500, y: 20 + rand() * 130, dx: (rand() - 0.5) * 60, dy: -(10 + rand() * 30),
    size: 0.6 + rand() * 1.1, period: [6, 9, 18][Math.floor(rand() * 3)], phase: rand() };
});

const EXPO_OUT = 'cubic-bezier(0.16, 1, 0.3, 1)';
const EXPO_IN = 'cubic-bezier(0.7, 0, 0.84, 0)';
const INOUT = 'cubic-bezier(0.65, 0, 0.35, 1)';

// Long translations shrink until they fit the card.
function fitMessages() {
  const room = $('messages').clientWidth;
  messages.forEach((node) => {
    node.style.fontSize = '';
    const width = node.scrollWidth;
    if (width > room) node.style.fontSize = `${Math.floor(30 * (room / width) * 10) / 10}px`;
  });
}

// One appearance: in (0–1.6 s), messages rotate, out (last 0.9 s). With stay, there is no out and the
// light sweeps and messages repeat endlessly (period LOOP). Returns its animations.
const SLOT = 6; // seconds per message while staying on screen; also the light sweep interval
const LOOP = () => messages.length * SLOT;

function cycle(stay) {
  const ms = (s) => s * 1000;
  const anims = [];
  const add = (node, frames, start, duration, easing = EXPO_OUT, extra = {}) => {
    anims.push(node.animate(frames, { delay: ms(start), duration: ms(duration), easing, fill: 'both', ...extra }));
  };
  const outAt = SHOW - 0.9;

  // In: a line of light draws along the top edge, the card opens behind it.
  add($('edge'), [{ transform: 'scaleX(0)', opacity: 1 }, { transform: 'scaleX(1)', opacity: 1 }], 0, 0.55, INOUT);
  add($('edge'), [{ opacity: 1 }, { opacity: 0.25 }], 0.6, 1.2, 'ease-out');
  add($('card'), [{ clipPath: 'inset(0 100% 0 0 round 16px)' }, { clipPath: 'inset(0 0% 0 0 round 16px)' }], 0.2, 0.9);
  add($('logo'), [{ opacity: 0, filter: 'brightness(2.4) blur(6px)', transform: 'translateX(-14px)' },
    { opacity: 1, filter: 'brightness(1) blur(0px)', transform: 'none' }], 0.45, 1.0);
  add($('divider'), [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], 0.6, 0.8);
  add($('label'), [{ transform: 'translateY(120%)' }, { transform: 'none' }], 0.7, 0.8);
  add($('discord'), [{ transform: 'translateY(130%)' }, { transform: 'none' }], 0.95, 0.8);

  // Light sweeps over the logo and the card every SLOT seconds.
  const sweep = (node, start, length) => {
    const frames = [{ transform: 'translateX(-130%)', offset: 0, easing: INOUT }, { transform: 'translateX(130%)', offset: length / SLOT },
      { transform: 'translateX(130%)', offset: 1 }];
    const repeats = stay ? Infinity : Math.max(1, Math.floor((outAt - 0.5 - start) / SLOT) + 1);
    add(node, frames, start, SLOT, 'linear', { fill: 'none', iterations: repeats });
  };
  sweep($('shine'), 1.1, 1.1);
  sweep($('sheen'), 1.25, 1.4);

  // Messages: each slides up into view and out again. Staying: endless rotation; otherwise the last one
  // stays until the exit. Outside its own slot a message sits below the mask (CSS), so no fill is needed.
  const first = 0.85;
  const count = messages.length;
  const slot = stay ? SLOT : Math.max(2.4, (outAt - first) / count);
  messages.forEach((node, i) => {
    if (stay) {
      const loop = count * slot;
      const a = (i * slot) / loop, b = ((i + 1) * slot) / loop;
      const frames = [
        { transform: 'translateY(110%)', offset: 0 },
        { transform: 'translateY(110%)', offset: a, easing: EXPO_OUT },
        { transform: 'none', offset: a + 0.6 / loop },
        { transform: 'none', offset: b - 0.4 / loop, easing: EXPO_IN },
        { transform: 'translateY(-110%)', offset: b },
        ...(b < 1 ? [{ transform: 'translateY(-110%)', offset: 1 }] : []),
      ];
      add(node, frames, first, loop, 'linear', { fill: 'none', iterations: Infinity });
      return;
    }
    const at = first + i * slot;
    const last = i === count - 1;
    const length = last ? outAt - at : slot;
    const frames = [
      { transform: 'translateY(110%)', offset: 0, easing: EXPO_OUT },
      { transform: 'none', offset: 0.6 / length, easing: 'linear' },
      ...(last ? [{ transform: 'none', offset: 1 }]
        : [{ transform: 'none', offset: (slot - 0.4) / slot, easing: EXPO_IN }, { transform: 'translateY(-110%)', offset: 1 }]),
    ];
    add(node, frames, at, length, 'linear', { fill: last ? 'forwards' : 'none' });
  });

  ambient(add, stay, outAt);

  if (!stay) {
    add($('fx'), [{ opacity: 1 }, { opacity: 0 }], outAt, 0.4, 'ease-in', { fill: 'forwards' });
    add($('dust'), [{ opacity: 1 }, { opacity: 0 }], outAt, 0.4, 'ease-in', { fill: 'forwards' });
    // Out: content drops away, the card closes to the left, the edge light runs out.
    add($('label'), [{ transform: 'none' }, { transform: 'translateY(-120%)' }], outAt, 0.4, EXPO_IN, { fill: 'forwards' });
    add(messages[messages.length - 1], [{ transform: 'none' }, { transform: 'translateY(-110%)' }], outAt, 0.4, EXPO_IN, { fill: 'forwards' });
    add($('discord'), [{ transform: 'none' }, { transform: 'translateY(130%)' }], outAt, 0.4, EXPO_IN, { fill: 'forwards' });
    add($('logo'), [{ opacity: 1 }, { opacity: 0 }], outAt + 0.1, 0.4, 'ease-in', { fill: 'forwards' });
    add($('card'), [{ clipPath: 'inset(0 0% 0 0 round 16px)' }, { clipPath: 'inset(0 100% 0 0 round 16px)' }], outAt + 0.25, 0.6, EXPO_IN, { fill: 'forwards' });
    add($('edge'), [{ transform: 'scaleX(1)', opacity: 0.25 }, { transform: 'scaleX(0)', opacity: 1 }], outAt + 0.25, 0.6, EXPO_IN, { fill: 'forwards' });
  }
  return anims;
}

// Permanent light effects. Every period divides LOOP (18 s), so the banner repeats exactly every LOOP seconds.
function ambient(add, stay, outAt) {
  const L = LOOP();
  const forever = (period, start) => (stay ? Infinity : Math.max(1, Math.ceil((outAt - start) / period)));
  const at = (seconds) => Math.min(1, seconds / L);

  // A point of light runs around the card's border.
  add($('ring'), [{ opacity: 0 }, { opacity: 1 }], 1.2, 1.0, 'ease-out');
  add($('ring'), [{ '--angle': '0deg' }, { '--angle': '360deg' }], 0, SLOT, 'linear', { fill: 'none', iterations: forever(SLOT, 0) });

  // A bright segment scans along the top edge, between the logo sweeps.
  add($('scan'), [
    { transform: 'translateX(-180px)', opacity: 0, offset: 0, easing: INOUT },
    { transform: 'translateX(-120px)', opacity: 1, offset: 0.2 / SLOT, easing: INOUT },
    { transform: 'translateX(640px)', opacity: 1, offset: 1.5 / SLOT },
    { transform: 'translateX(700px)', opacity: 0, offset: 1.7 / SLOT },
    { transform: 'translateX(700px)', opacity: 0, offset: 1 },
  ], 4.1, SLOT, 'linear', { fill: 'none', iterations: forever(SLOT, 4.1) });

  // Re-ignite once per loop, just before the first line comes back: the edge light redraws, the card
  // and logo flash, the logo tears for a few frames.
  const fire = 0.85; // cycle anchor = first message
  const ignite = L - 0.9;
  add($('edge-flash'), [
    { transform: 'scaleX(0)', opacity: 0, offset: 0 },
    { transform: 'scaleX(0)', opacity: 1, offset: at(ignite), easing: INOUT },
    { transform: 'scaleX(1)', opacity: 1, offset: at(ignite + 0.45), easing: 'ease-out' },
    { transform: 'scaleX(1)', opacity: 0, offset: 1 },
  ], fire, L, 'linear', { fill: 'none', iterations: forever(L, fire) });
  const flash = (node, peak) => add(node, [
    { opacity: 0, offset: 0 }, { opacity: 0, offset: at(ignite + 0.35) },
    { opacity: peak, offset: at(ignite + 0.42), easing: 'ease-out' }, { opacity: 0, offset: 1 },
  ], fire, L, 'linear', { fill: 'none', iterations: forever(L, fire) });
  flash($('card-flash'), 1);
  flash(logoFlash, 0.85);
  slices.forEach((node) => {
    const frames = [{ opacity: 0, transform: 'none', offset: 0 }];
    for (let k = 0; k < 7; k++) {
      const on = rand() < 0.7;
      frames.push({ opacity: on ? 1 : 0, transform: `translateX(${Math.round((rand() - 0.5) * 22)}px)`, offset: at(ignite + 0.38 + k / 30), easing: 'steps(1, end)' });
    }
    frames.push({ opacity: 0, transform: 'none', offset: at(ignite + 0.38 + 7 / 30) }, { opacity: 0, transform: 'none', offset: 1 });
    add(node, frames, fire, L, 'linear', { fill: 'none', iterations: forever(L, fire) });
  });

  // Dust drifting through the card.
  motes.forEach((m) => {
    const p = m.period;
    add(m.node, [
      { transform: `translate(${m.x}px, ${m.y}px) scale(${m.size})`, opacity: 0 },
      { transform: `translate(${m.x + m.dx * 0.5}px, ${m.y + m.dy * 0.5}px) scale(${m.size})`, opacity: 0.75, offset: 0.5 },
      { transform: `translate(${m.x + m.dx}px, ${m.y + m.dy}px) scale(${m.size})`, opacity: 0 },
    ], 1.4 - m.phase * p, p, 'ease-in-out', { fill: 'none', iterations: forever(p, 1.4 - m.phase * p) });
  });
}

let current = [];
function play() {
  current.forEach((a) => a.cancel());
  banner.classList.add('on');
  current = cycle(EVERY === 0);
  if (EVERY > 0) setTimeout(() => banner.classList.remove('on'), SHOW * 1000);
}

// Export hook, paused and seekable: one appearance (prepare()) or the permanent banner (prepare(true)), whose
// steady state repeats every loop seconds from loopStart on.
window.__overlay = {
  duration: SHOW,
  loopStart: 7,
  get loop() { return LOOP(); },
  prepare(stay = false) {
    fitMessages(); current.forEach((a) => a.cancel()); banner.classList.add('on'); current = cycle(stay); current.forEach((a) => a.pause());
  },
  seek(t) { current.forEach((a) => { a.currentTime = t * 1000; }); },
};

if (!params.has('render')) {
  document.fonts.ready.then(() => {
    fitMessages();
    setTimeout(() => {
      play();
      if (EVERY > 0) setInterval(play, Math.max(EVERY, SHOW + 1) * 1000);
    }, DELAY * 1000);
  });
}
</script>
</body>
</html>
